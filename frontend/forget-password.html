<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - CropCare</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">🌱 CropCare</a>
        <h2>Reset your password</h2>
        <p>Enter your email and we'll send you a reset link</p>
      </div>

      <form id="forgotPasswordForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          />
          <small class="form-hint">We'll send a password reset link to this email</small>
        </div>

        <button type="submit" class="btn-primary btn-block" id="resetBtn">
          Send Reset Link
        </button>

        <div class="auth-links">
          <a href="login.html">← Back to Sign In</a>
        </div>
      </form>

      <div class="auth-footer">
        <p>
          Don't have an account? 
          <a href="register.html">Sign up now</a>
        </p>
      </div>

      <div id="toastContainer" class="toast-container"></div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgotPasswordForm');
      const emailInput = document.getElementById('email');
      const submitBtn = document.getElementById('resetBtn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();

        if (!email) {
          showToast('Please enter your email address', 'error');
          return;
        }

        // Validate email format
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showToast('Please enter a valid email address', 'error');
          return;
        }

        // Show loading
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        try {
          const response = await fetch('https://crop-care-be.vercel.app/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });

          const data = await response.json();

          if (data.success) {
            showToast('✅ Reset link sent! Check your email.', 'success');
            // Clear form
            emailInput.value = '';
            
            // Redirect to login after 3 seconds
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 3000);
          } else {
            showToast(data.message || 'Something went wrong', 'error');
          }
        } catch (error) {
          console.error('Forgot password error:', error);
          showToast('Network error. Please try again.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Reset Link';
        }
      });
    });
  </script>
</body>
</html>

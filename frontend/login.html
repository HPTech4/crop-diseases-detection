<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - CropCare</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <p class="auth-eyebrow">Grower access</p>

        <div class="auth-header">
          <div class="auth-mark">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M12 21C12 21 4 17 4 9.5C4 5.9 7 3 10.5 3C11.6 3 12.6 3.4 13.4 4.1C13.9 3.4 14.7 3 15.5 3C18 3 20 5 20 7.5C20 15 12 21 12 21Z"
                fill="#2F5233"
              />
              <path
                d="M12 21C12 21 12 13 12 9"
                stroke="#FAF6EC"
                stroke-width="1.1"
                stroke-linecap="round"
              />
            </svg>
            CropCare
          </div>
          <p>Sign in to check on your fields</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />
              <button
                type="button"
                id="togglePassword"
                class="toggle-password"
                aria-label="Show password"
              >
                <svg
                  class="icon-eye"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <path
                    d="M2 12C2 12 5.5 6 12 6C18.5 6 22 12 22 12C22 12 18.5 18 12 18C5.5 18 2 12 2 12Z"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                </svg>
                <svg
                  class="icon-eye-off"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <path
                    d="M3 3L21 21"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                  <path
                    d="M10.6 6.2C11.05 6.1 11.52 6 12 6C18.5 6 22 12 22 12C21.4 13.1 20.5 14.3 19.3 15.4M6.7 7.6C4.4 9 2 12 2 12C2 12 5.5 18 12 18C13.3 18 14.5 17.7 15.5 17.3"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                  <path
                    d="M9.9 9.9C9.3 10.5 9 11.2 9 12C9 13.7 10.3 15 12 15C12.8 15 13.5 14.7 14.1 14.1"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" />
              <span>Remember me</span>
            </label>
            <a href="../pages/forget-password.html" class="forgot-link"
              >Forgot password?</a
            >
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
            Sign in
          </button>

          <div class="auth-divider">
            <span>or continue with</span>
          </div>

          <button type="button" class="btn-google" id="googleLogin">
            <span class="google-mark">G</span> Continue with Google
          </button>
        </form>

        <div class="auth-footer">
          <p>
            Don't have an account?
            <a href="register.html">Sign up now</a>
          </p>
        </div>

        <div id="toastContainer" class="toast-container"></div>
      </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const rememberMe = document.getElementById("rememberMe");

        // Check if already logged in
        const token = localStorage.getItem("token");
        if (token) {
          window.location.href = "dashboard.html";
          return;
        }

        // Toggle password visibility
        togglePassword.addEventListener("click", () => {
          const isVisible = passwordInput.type === "text";
          const type = isVisible ? "password" : "text";
          passwordInput.type = type;
          togglePassword.classList.toggle("is-visible", !isVisible);
          togglePassword.setAttribute(
            "aria-label",
            isVisible ? "Show password" : "Hide password",
          );
        });

        // Handle login
        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = emailInput.value.trim();
          const password = passwordInput.value;

          // Validate
          if (!email || !password) {
            showToast("Please fill in all fields", "error");
            return;
          }

          // Show loading
          const btn = document.getElementById("loginBtn");
          btn.disabled = true;
          btn.textContent = "Signing in…";

          try {
            const response = await fetch(
              "https://crop-care-be.vercel.app/api/auth/login",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password }),
              },
            );

            const data = await response.json();

            if (data.success) {
              // Save token
              localStorage.setItem("token", data.token);
              localStorage.setItem("user", JSON.stringify(data.user));

              if (rememberMe.checked) {
                localStorage.setItem("rememberMe", "true");
              }

              showToast("Welcome back.", "success");

              // Redirect to dashboard
              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 1000);
            } else {
              showToast(data.message || "Login failed", "error");
              btn.disabled = false;
              btn.textContent = "Sign in";
            }
          } catch (error) {
            console.error("Login error:", error);
            showToast("Network error. Please try again.", "error");
            btn.disabled = false;
            btn.textContent = "Sign in";
          }
        });
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CropCare</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🌱 CropCare</h1>
        <p>Welcome back! Sign in to your account</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            placeholder="you@example.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              placeholder="Enter your password" 
              required 
            />
            <button type="button" id="togglePassword" class="toggle-password">
              👁️
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" />
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary btn-block" id="loginBtn">
          Sign In
        </button>

        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <button type="button" class="btn-google" id="googleLogin">
          <span>🔵</span> Google
        </button>
      </form>

      <div class="auth-footer">
        <p>
          Don't have an account? 
          <a href="register.html">Sign up now</a>
        </p>
      </div>

      <div id="toastContainer" class="toast-container"></div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const togglePassword = document.getElementById('togglePassword');
      const rememberMe = document.getElementById('rememberMe');

      // Check if already logged in
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = 'dashboard.html';
        return;
      }

      // Toggle password visibility
      togglePassword.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        togglePassword.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
      });

      // Handle login
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        // Validate
        if (!email || !password) {
          showToast('Please fill in all fields', 'error');
          return;
        }

        // Show loading
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        try {
          const response = await fetch('https://crop-care-be.vercel.app/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (data.success) {
            // Save token
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));

            if (rememberMe.checked) {
              localStorage.setItem('rememberMe', 'true');
            }

            showToast('Welcome back! 🎉', 'success');
            
            // Redirect to dashboard
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1000);
          } else {
            showToast(data.message || 'Login failed', 'error');
            btn.disabled = false;
            btn.textContent = 'Sign In';
          }
        } catch (error) {
          console.error('Login error:', error);
          showToast('Network error. Please try again.', 'error');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - CropCare</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🌱 CropCare</h1>
        <p>Create your free account</p>
      </div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input 
            type="text" 
            id="fullName" 
            placeholder="John Doe" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            placeholder="you@example.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              placeholder="Min 6 characters" 
              required 
            />
            <button type="button" id="togglePassword" class="toggle-password">
              👁️
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            placeholder="Confirm your password" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="terms" required />
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn-primary btn-block" id="registerBtn">
          Create Account
        </button>

        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <button type="button" class="btn-google" id="googleRegister">
          <span>🔵</span> Google
        </button>
      </form>

      <div class="auth-footer">
        <p>
          Already have an account? 
          <a href="login.html">Sign in</a>
        </p>
      </div>

      <div id="toastContainer" class="toast-container"></div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');
      const fullName = document.getElementById('fullName');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');
      const terms = document.getElementById('terms');
      const togglePassword = document.getElementById('togglePassword');

      // Check if already logged in
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = 'dashboard.html';
        return;
      }

      // Toggle password visibility
      togglePassword.addEventListener('click', () => {
        const type = password.type === 'password' ? 'text' : 'password';
        password.type = type;
        togglePassword.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
      });

      // Password strength indicator
      password.addEventListener('input', () => {
        const val = password.value;
        const strength = document.getElementById('passwordStrength');
        if (!strength) {
          const div = document.createElement('div');
          div.id = 'passwordStrength';
          div.className = 'password-strength';
          password.parentNode.appendChild(div);
        }
        const el = document.getElementById('passwordStrength');
        if (val.length === 0) {
          el.textContent = '';
          el.className = 'password-strength';
        } else if (val.length < 6) {
          el.textContent = '⚠️ Too short';
          el.className = 'password-strength weak';
        } else if (val.length < 10) {
          el.textContent = '✓ Medium strength';
          el.className = 'password-strength medium';
        } else {
          el.textContent = '✓ Strong password';
          el.className = 'password-strength strong';
        }
      });

      // Handle registration
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Validate
        const name = fullName.value.trim();
        const emailVal = email.value.trim();
        const passVal = password.value;
        const confirmVal = confirmPassword.value;

        if (!name || !emailVal || !passVal || !confirmVal) {
          showToast('Please fill in all fields', 'error');
          return;
        }

        if (passVal.length < 6) {
          showToast('Password must be at least 6 characters', 'error');
          return;
        }

        if (passVal !== confirmVal) {
          showToast('Passwords do not match', 'error');
          return;
        }

        if (!terms.checked) {
          showToast('Please agree to the Terms of Service', 'error');
          return;
        }

        // Show loading
        const btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.textContent = 'Creating account...';

        try {
          const response = await fetch('https://crop-care-be.vercel.app/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name,
              email: emailVal,
              password: passVal
            })
          });

          const data = await response.json();

          if (data.success) {
            showToast('Account created successfully! 🎉', 'success');
            
            // Auto login after registration
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1500);
          } else {
            showToast(data.message || 'Registration failed', 'error');
            btn.disabled = false;
            btn.textContent = 'Create Account';
          }
        } catch (error) {
          console.error('Register error:', error);
          showToast('Network error. Please try again.', 'error');
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>

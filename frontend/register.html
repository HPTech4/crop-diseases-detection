<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - CropCare</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <p class="auth-eyebrow">New grower record</p>

      <div class="auth-header">
        <div class="auth-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 21C12 21 4 17 4 9.5C4 5.9 7 3 10.5 3C11.6 3 12.6 3.4 13.4 4.1C13.9 3.4 14.7 3 15.5 3C18 3 20 5 20 7.5C20 15 12 21 12 21Z" fill="#2F5233"/>
            <path d="M12 21C12 21 12 13 12 9" stroke="#FAF6EC" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
          CropCare
        </div>
        <p>Create your free account</p>
      </div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input
            type="text"
            id="fullName"
            placeholder="John Doe"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Min 6 characters"
              required
            />
            <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M2 12C2 12 5.5 6 12 6C18.5 6 22 12 22 12C22 12 18.5 18 12 18C5.5 18 2 12 2 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M10.6 6.2C11.05 6.1 11.52 6 12 6C18.5 6 22 12 22 12C21.4 13.1 20.5 14.3 19.3 15.4M6.7 7.6C4.4 9 2 12 2 12C2 12 5.5 18 12 18C13.3 18 14.5 17.7 15.5 17.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M9.9 9.9C9.3 10.5 9 11.2 9 12C9 13.7 10.3 15 12 15C12.8 15 13.5 14.7 14.1 14.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
          />
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="terms" required />
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
          Create account
        </button>

        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <button type="button" class="btn-google" id="googleRegister">
          <span class="google-mark">G</span> Continue with Google
        </button>
      </form>

      <div class="auth-footer">
        <p>
          Already have an account?
          <a href="./login.html">Sign in</a>
        </p>
      </div>

      <div id="toastContainer" class="toast-container"></div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');
      const fullName = document.getElementById('fullName');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');
      const terms = document.getElementById('terms');
      const togglePassword = document.getElementById('togglePassword');

      // Check if already logged in
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = './dashboard.html';
        return;
      }

      // Toggle password visibility
      togglePassword.addEventListener('click', () => {
        const isVisible = password.type === 'text';
        const type = isVisible ? 'password' : 'text';
        password.type = type;
        togglePassword.classList.toggle('is-visible', !isVisible);
        togglePassword.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
      });

      // Password strength indicator
      password.addEventListener('input', () => {
        const val = password.value;
        let strength = document.getElementById('passwordStrength');
        if (!strength) {
          strength = document.createElement('div');
          strength.id = 'passwordStrength';
          strength.className = 'password-strength';
          strength.innerHTML = '<span class="strength-dot"></span><span class="strength-text"></span>';
          password.parentNode.appendChild(strength);
        }
        const label = strength.querySelector('.strength-text');
        if (val.length === 0) {
          label.textContent = '';
          strength.className = 'password-strength';
        } else if (val.length < 6) {
          label.textContent = 'Too short';
          strength.className = 'password-strength weak';
        } else if (val.length < 10) {
          label.textContent = 'Medium strength';
          strength.className = 'password-strength medium';
        } else {
          label.textContent = 'Strong password';
          strength.className = 'password-strength strong';
        }
      });

      // Handle registration
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Validate
        const name = fullName.value.trim();
        const emailVal = email.value.trim();
        const passVal = password.value;
        const confirmVal = confirmPassword.value;

        if (!name || !emailVal || !passVal || !confirmVal) {
          showToast('Please fill in all fields', 'error');
          return;
        }

        if (passVal.length < 6) {
          showToast('Password must be at least 6 characters', 'error');
          return;
        }

        if (passVal !== confirmVal) {
          showToast('Passwords do not match', 'error');
          return;
        }

        if (!terms.checked) {
          showToast('Please agree to the Terms of Service', 'error');
          return;
        }

        // Show loading
        const btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.textContent = 'Creating account…';

        try {
          const response = await fetch('https://crop-care-be.vercel.app/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name,
              email: emailVal,
              password: passVal
            })
          });

          const data = await response.json();

          if (data.success) {
            showToast('Account created. Redirecting to sign in.', 'success');

            // Auto login after registration
            setTimeout(() => {
              window.location.href = './login.html';
            }, 1500);
          } else {
            showToast(data.message || 'Registration failed', 'error');
            btn.disabled = false;
            btn.textContent = 'Create account';
          }
        } catch (error) {
          console.error('Register error:', error);
          showToast('Network error. Please try again.', 'error');
          btn.disabled = false;
          btn.textContent = 'Create account';
        }
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - CropCare</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">🌱 CropCare</a>
        <h2>Create new password</h2>
        <p>Choose a strong password for your account</p>
      </div>

      <form id="resetPasswordForm" class="auth-form">
        <div class="form-group">
          <label for="password">New Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              placeholder="Min 6 characters" 
              required 
              minlength="6"
            />
            <button type="button" id="togglePassword" class="toggle-password">
              👁️
            </button>
          </div>
          <div id="passwordStrength" class="password-strength"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            placeholder="Confirm your new password" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="showPasswords" />
            <span>Show passwords</span>
          </label>
        </div>

        <button type="submit" class="btn-primary btn-block" id="resetBtn">
          Reset Password
        </button>

        <div class="auth-links">
          <a href="login.html">← Back to Sign In</a>
        </div>
      </form>

      <div id="toastContainer" class="toast-container"></div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('resetPasswordForm');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');
      const togglePassword = document.getElementById('togglePassword');
      const showPasswords = document.getElementById('showPasswords');
      const submitBtn = document.getElementById('resetBtn');

      // Get token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      // Validate token exists
      if (!token) {
        showToast('Invalid or missing reset token', 'error');
        setTimeout(() => {
          window.location.href = 'forgot-password.html';
        }, 2000);
        return;
      }

      // Toggle password visibility
      togglePassword.addEventListener('click', () => {
        const type = password.type === 'password' ? 'text' : 'password';
        password.type = type;
        togglePassword.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
      });

      // Show/hide both passwords
      showPasswords.addEventListener('change', (e) => {
        const type = e.target.checked ? 'text' : 'password';
        password.type = type;
        confirmPassword.type = type;
      });

      // Password strength indicator
      password.addEventListener('input', () => {
        const val = password.value;
        const strength = document.getElementById('passwordStrength');
        
        if (val.length === 0) {
          strength.textContent = '';
          strength.className = 'password-strength';
        } else if (val.length < 6) {
          strength.textContent = '⚠️ Too short (min 6 characters)';
          strength.className = 'password-strength weak';
        } else if (val.length < 10) {
          strength.textContent = '✓ Medium strength';
          strength.className = 'password-strength medium';
        } else if (/[A-Z]/.test(val) && /[0-9]/.test(val)) {
          strength.textContent = '✓ Strong password';
          strength.className = 'password-strength strong';
        } else {
          strength.textContent = '✓ Good strength';
          strength.className = 'password-strength medium';
        }
      });

      // Handle form submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const newPassword = password.value;
        const confirm = confirmPassword.value;

        // Validate password
        if (newPassword.length < 6) {
          showToast('Password must be at least 6 characters', 'error');
          return;
        }

        if (newPassword !== confirm) {
          showToast('Passwords do not match', 'error');
          return;
        }

        // Show loading
        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting...';

        try {
          const response = await fetch('https://crop-care-be.vercel.app/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token,
              password: newPassword
            })
          });

          const data = await response.json();

          if (data.success) {
            showToast('✅ Password reset successful!', 'success');
            
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 2000);
          } else {
            showToast(data.message || 'Failed to reset password', 'error');
          }
        } catch (error) {
          console.error('Reset password error:', error);
          showToast('Network error. Please try again.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Reset Password';
        }
      });
    });
  </script>
</body>
</html>
